syntax = "proto3";

package qoe.finphysics.v1;

import "google/protobuf/timestamp.proto";

enum AccountCategory {
  CATEGORY_UNSPECIFIED = 0;
  REVENUE = 1;
  COGS = 2;
  OPEX = 3;
  CURRENT_ASSET = 4;
  NON_CURRENT_ASSET = 5;
  CURRENT_LIABILITY = 6;
  NON_CURRENT_LIABILITY = 7;
  EQUITY = 8;
}

message JournalEntryLine {
  int64 line_id = 1;
  string account_number = 2;
  string account_name = 3;
  AccountCategory category = 4;
  double debit_amount = 5;
  double credit_amount = 6;
  string entity_name = 7;
  string memo = 8;
  string document_ref = 9;
}

message ProposedTransaction {
  string transaction_id = 1;
  string journal_entry_id = 2;
  int32 sim_day = 3;
  google.protobuf.Timestamp effective_date = 4;
  string erp_system = 5;
  repeated JournalEntryLine lines = 6;
  bool is_reversing_entry = 7;
}

message CommitTransactionRequest {
  string engagement_id = 1;
  ProposedTransaction transaction = 2;
}

message CommitTransactionResponse {
  bool committed = 1;
  string transaction_id = 2;
  string event_id = 3;
  repeated string verified_invariants = 4; // ["INV1", "INV2", "INV3"]
  string error_message = 5;
}

message VerifyInvariantsRequest {
  string engagement_id = 1;
  int32 simulation_day = 2;
}

message InvariantStatus {
  string invariant_code = 1; // "INV1", "INV2", ...
  string invariant_name = 2;
  bool passed = 3;
  double discrepancy_amount = 4; // Must be 0.0000
}

message VerifyInvariantsResponse {
  bool all_passed = 1;
  repeated InvariantStatus invariant_statuses = 2;
}

message AccountBalance {
  string account_number = 1;
  string account_name = 2;
  AccountCategory category = 3;
  double debit_balance = 4;
  double credit_balance = 5;
  double net_balance = 6;
}

message GetTrialBalanceRequest {
  string engagement_id = 1;
  int32 simulation_day = 2;
}

message GetTrialBalanceResponse {
  string engagement_id = 1;
  int32 simulation_day = 2;
  double total_debits = 3;
  double total_credits = 4;
  bool is_balanced = 5; // total_debits == total_credits
  repeated AccountBalance balances = 6;
}

service FinancialPhysicsService {
  rpc CommitTransaction (CommitTransactionRequest) returns (CommitTransactionResponse);
  rpc VerifyInvariants (VerifyInvariantsRequest) returns (VerifyInvariantsResponse);
  rpc GetTrialBalance (GetTrialBalanceRequest) returns (GetTrialBalanceResponse);
}
